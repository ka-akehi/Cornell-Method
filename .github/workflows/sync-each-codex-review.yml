name: Sync Issues from each Codex review

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-to-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const review = context.payload.review;
            const prNumber = context.payload.pull_request?.number;
            const normalize = (login) =>
              String(login ?? "").replace(/\[bot\]$/i, "").toLowerCase();
            const isCodex = (login) =>
              normalize(login) === "chatgpt-codex-connector";
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            if (!Number.isInteger(prNumber) || !isCodex(review?.user?.login)) {
              core.info("Ignoring a non-Codex review.");
              return;
            }

            const prResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const pr = prResponse.data;
            const headSha = pr.head.sha;
            if (
              pr.state !== "open" ||
              pr.merged_at != null ||
              review.commit_id !== headSha
            ) {
              core.info(
                `Ignoring review ${review.id}: reviewed ${review.commit_id}, current HEAD is ${headSha}.`,
              );
              return;
            }

            let activeIds = null;
            try {
              const result = await github.graphql(
                `query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$number){
                      reviewThreads(first:100){nodes{
                        isResolved isOutdated
                        comments(first:100){nodes{databaseId}}
                      }}
                    }
                  }
                }`,
                { owner, repo, number: prNumber },
              );
              const threads = result.repository?.pullRequest?.reviewThreads?.nodes;
              if (Array.isArray(threads)) {
                activeIds = new Set(
                  threads
                    .filter((thread) => !thread.isResolved && !thread.isOutdated)
                    .flatMap((thread) => thread.comments?.nodes ?? [])
                    .map((comment) => comment.databaseId)
                    .filter(Number.isInteger),
                );
              }
            } catch (error) {
              core.warning(
                `PR #${prNumber}: thread-state lookup failed; using this review only: ${error.message}`,
              );
            }

            let reviewComments = [];
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const comments = await github.paginate(
                github.rest.pulls.listReviewComments,
                { owner, repo, pull_number: prNumber, per_page: 100 },
              );
              reviewComments = comments.filter(
                (comment) =>
                  !comment.in_reply_to_id &&
                  comment.pull_request_review_id === review.id &&
                  (activeIds === null || activeIds.has(comment.id)),
              );
              if (reviewComments.length > 0 || attempt === 3) break;
              await sleep(2_000);
            }

            const priorityOf = (body) => {
              const text = String(body ?? "");
              const badge = text.match(
                /!\[P([0-3])\s+Badge\](?:\([^)]*\))?/i,
              );
              if (badge) return `P${badge[1]}`;
              const bracket = text.match(
                /(?:^|\n)\s*(?:#{1,6}\s*)?(?:[-*]\s*)?\[P([0-3])\](?:\s+|$)/i,
              );
              return bracket ? `P${bracket[1]}` : null;
            };

            const cleanTitle = (body, priority) => {
              const first =
                String(body ?? "")
                  .replace(/\r\n/g, "\n")
                  .split("\n")
                  .map((line) => line.trim())
                  .find(Boolean) ?? `${priority} review finding`;
              return (
                first
                  .replace(/!\[P[0-3]\s+Badge\](?:\([^)]*\))?/gi, "")
                  .replace(/<[^>]+>/g, "")
                  .replace(/^#{1,6}\s*/, "")
                  .replace(/^\*\*\s*|\s*\*\*$/g, "")
                  .replace(/^\[P[0-3]\]\s*/i, "")
                  .replace(/[*_`~]/g, "")
                  .replace(/\s+/g, " ")
                  .trim()
                  .slice(0, 160) || `${priority} review finding`
              );
            };

            const findings = reviewComments
              .map((comment) => {
                const priority = priorityOf(comment.body);
                if (!priority || priority === "P3") return null;
                return {
                  id: String(comment.id),
                  priority,
                  title: cleanTitle(comment.body, priority),
                  body: String(comment.body ?? ""),
                  url: comment.html_url,
                  path: comment.path ?? null,
                  line: comment.line ?? comment.original_line ?? null,
                };
              })
              .filter(Boolean);

            if (findings.length === 0) {
              core.info(
                `PR #${prNumber}: submitted review ${review.id} contains no active P0-P2 finding.`,
              );
              return;
            }

            const trackedIssues = (
              await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "all",
                per_page: 100,
              })
            ).filter((item) => !item.pull_request);
            const created = [];
            const reopened = [];
            const reused = [];

            for (const finding of findings) {
              const marker =
                `<!-- codex-review-source:PR-${prNumber}:review-comment:${finding.id} -->`;
              const existing = trackedIssues.find(
                (issue) =>
                  typeof issue.body === "string" && issue.body.includes(marker),
              );

              if (existing) {
                if (existing.state === "closed") {
                  const response = await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    state: "open",
                  });
                  reopened.push(response.data);
                } else {
                  reused.push(existing);
                }
                continue;
              }

              const current = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              if (
                current.data.state !== "open" ||
                current.data.merged_at != null ||
                current.data.head.sha !== headSha
              ) {
                core.info(`PR #${prNumber}: state or HEAD changed.`);
                return;
              }

              const blocking = finding.priority === "P0" || finding.priority === "P1";
              const location = finding.path
                ? `\`${finding.path}${finding.line ? `:${finding.line}` : ""}\``
                : "レビューコメント内の一般指摘";
              const quote = finding.body
                .replace(/\r\n/g, "\n")
                .split("\n")
                .map((line) => `> ${line}`)
                .join("\n");
              const body = [
                marker,
                "",
                "## Summary",
                `${finding.priority}のCodex Code Review findingを追跡します。`,
                "",
                "## Source PR and review",
                `- PR: ${pr.html_url}`,
                `- Review finding: ${finding.url}`,
                `- Reviewed HEAD: \`${headSha}\``,
                "- Source type: `review-comment`",
                "",
                "## Priority and disposition",
                `- Priority: **${finding.priority}**`,
                `- Disposition: ${
                  blocking
                    ? "PR内修正必須。Issue化してもマージブロッカーは解除されません。"
                    : "PR内修正か安全な後続作業かを最新HEADで判断してください。"
                }`,
                "",
                "## Current location",
                `- ${location}`,
                "",
                "## Original review finding",
                quote,
                "",
                "## Acceptance criteria",
                "- レビュー記載のTriggerが最新ブランチで再現しない",
                "- 根本原因と影響範囲を説明できる",
                "- 回帰テストまたは具体的な検証を実行する",
                "- 元レビューを再確認して対応結果を記録する",
              ].join("\n");

              const response = await github.rest.issues.create({
                owner,
                repo,
                title:
                  `[${finding.priority}][Code Review][PR #${prNumber}] ${finding.title}`.slice(
                    0,
                    250,
                  ),
                body,
              });
              created.push(response.data);
              trackedIssues.push(response.data);
            }

            const summary = [
              `<!-- codex-review-submission-sync:${headSha}:${review.id} -->`,
              "## Codex再レビューのIssue同期",
              "",
              `検証対象HEAD: \`${headSha}\``,
              `レビューID: \`${review.id}\``,
              "",
              "### Created Issues",
              ...(created.length
                ? created.map(
                    (issue) =>
                      `- [#${issue.number}](${issue.html_url}) ${issue.title}`,
                  )
                : ["- なし"]),
              "",
              "### Reopened Issues",
              ...(reopened.length
                ? reopened.map(
                    (issue) =>
                      `- [#${issue.number}](${issue.html_url}) ${issue.title}`,
                  )
                : ["- なし"]),
              "",
              "### Reused existing Issues",
              ...(reused.length
                ? reused.map(
                    (issue) =>
                      `- [#${issue.number}](${issue.html_url}) ${issue.title}`,
                  )
                : ["- なし"]),
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: summary,
            });
            core.info(
              `PR #${prNumber}: created=${created.length}, reopened=${reopened.length}, reused=${reused.length}.`,
            );
