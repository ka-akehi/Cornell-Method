name: Create Issues from Codex review findings

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number; leave empty to scan all open PRs
        required: false
        type: string
      force:
        description: Repost the PR synchronization summary
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

# A single queue protects read-before-create deduplication across all triggers.
concurrency:
  group: codex-review-to-issues
  cancel-in-progress: false

jobs:
  create-review-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v9
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          FORCE_SUMMARY: ${{ inputs.force || false }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            const eventAction = context.payload.action;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const normalize = (login) =>
              String(login ?? "").replace(/\[bot\]$/i, "").toLowerCase();
            const isCodex = (login) => normalize(login) === "chatgpt-codex-connector";
            const isTrustedSummary = (login) => {
              const value = normalize(login);
              return value === "github-actions" || value === owner.toLowerCase();
            };
            const forced = () =>
              String(process.env.FORCE_SUMMARY ?? "false").toLowerCase() === "true";
            const isOpenAtHead = (pr, sha) =>
              pr.state === "open" && pr.merged_at == null && pr.head?.sha === sha;

            function priorityOf(body) {
              const text = String(body ?? "");
              const badge = text.match(/!\[P([0-3])\s+Badge\]/i);
              if (badge) return `P${badge[1]}`;
              const bracket = text.match(
                /(?:^|\n)\s*(?:#{1,6}\s*)?(?:[-*]\s*)?\[P([0-3])\](?:\s+|$)/i,
              );
              return bracket ? `P${bracket[1]}` : null;
            }

            function findingTitle(body, priority) {
              const first = String(body ?? "")
                .replace(/\r\n/g, "\n")
                .split("\n")
                .map((line) => line.trim())
                .find(Boolean) ?? `${priority} review finding`;
              return first
                .replace(/!\[P[0-3]\s+Badge\](?:\([^)]*\))?/gi, "")
                .replace(/<[^>]+>/g, "")
                .replace(/^#{1,6}\s*/, "")
                .replace(/^\*\*\s*|\s*\*\*$/g, "")
                .replace(/^\[P[0-3]\]\s*/i, "")
                .replace(/[*_`~]/g, "")
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 160) || `${priority} review finding`;
            }

            function sourceMarker(prNumber, finding) {
              return `<!-- codex-review-source:PR-${prNumber}:${finding.sourceType}:${finding.id} -->`;
            }

            function fingerprint(prNumber, finding) {
              const root = finding.title
                .toLowerCase()
                .normalize("NFKC")
                .replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 120);
              return crypto
                .createHash("sha256")
                .update([`PR-${prNumber}`, finding.path ?? "general", root].join(":"))
                .digest("hex")
                .slice(0, 24);
            }

            function referencedHead(body) {
              const match = String(body ?? "").match(
                /(?:検証対象HEAD|対象HEAD|Reviewed commit|Reviewed HEAD)\**\s*[:：]\s*\**\s*`?([0-9a-f]{7,40})`?/i,
              );
              return match?.[1]?.toLowerCase() ?? null;
            }

            function topLevelFindings(comment, headSha) {
              if (!isCodex(comment.user?.login)) return [];
              const body = String(comment.body ?? "").replace(/\r\n/g, "\n");
              const referenced = referencedHead(body);
              if (!referenced || !headSha.toLowerCase().startsWith(referenced)) return [];

              const lines = body.split("\n");
              const findings = [];
              for (let index = 0; index < lines.length; index += 1) {
                const heading = lines[index].match(
                  /^(#{1,6})\s*\[P([0-3])\](?:\s+(.+?))?\s*$/i,
                );
                if (!heading) continue;
                const priority = `P${heading[2]}`;
                const level = heading[1].length;
                let end = lines.length;
                for (let cursor = index + 1; cursor < lines.length; cursor += 1) {
                  const next = lines[cursor].match(/^(#{1,6})\s+\S/);
                  if (next && next[1].length <= level) {
                    end = cursor;
                    break;
                  }
                }
                if (priority !== "P3") {
                  const block = lines.slice(index, end).join("\n").trim();
                  const location = block.match(
                    /(?:^|\n)\s*(?:-\s*)?Location\s*:\s*`?([^:\n`]+?)(?::(\d+))?`?\s*$/im,
                  );
                  findings.push({
                    id: `${comment.id}-${index}`,
                    sourceType: "issue-comment",
                    priority,
                    title: findingTitle(lines[index], priority),
                    body: block,
                    url: comment.html_url,
                    path: location?.[1]?.trim() ?? null,
                    line: location?.[2] ? Number(location[2]) : null,
                  });
                }
                index = end - 1;
              }
              return findings;
            }

            async function activeReviewCommentIds(prNumber) {
              try {
                const result = await github.graphql(
                  `query($owner:String!,$repo:String!,$number:Int!){
                    repository(owner:$owner,name:$repo){
                      pullRequest(number:$number){
                        reviewThreads(first:100){nodes{
                          isResolved isOutdated
                          comments(first:100){nodes{databaseId}}
                        }}
                      }
                    }
                  }`,
                  { owner, repo, number: prNumber },
                );
                const threads = result.repository?.pullRequest?.reviewThreads?.nodes;
                if (!Array.isArray(threads)) return null;
                return new Set(
                  threads
                    .filter((thread) => !thread.isResolved && !thread.isOutdated)
                    .flatMap((thread) => thread.comments?.nodes ?? [])
                    .map((comment) => comment.databaseId)
                    .filter(Number.isInteger),
                );
              } catch (error) {
                core.warning(`PR #${prNumber}: thread-state lookup failed: ${error.message}`);
                return null;
              }
            }

            async function collectFindings(prNumber, headSha) {
              const [reviews, inlineComments, issueComments, activeIds] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                }),
                activeReviewCommentIds(prNumber),
              ]);

              const reviewIds = new Set(
                reviews
                  .filter((review) =>
                    isCodex(review.user?.login) &&
                    review.commit_id === headSha &&
                    review.state !== "PENDING",
                  )
                  .map((review) => review.id),
              );

              const inline = inlineComments
                .filter((comment) =>
                  isCodex(comment.user?.login) &&
                  !comment.in_reply_to_id &&
                  (comment.commit_id === headSha || reviewIds.has(comment.pull_request_review_id)) &&
                  (activeIds === null || activeIds.has(comment.id)),
                )
                .map((comment) => {
                  const priority = priorityOf(comment.body);
                  if (!priority || priority === "P3") return null;
                  return {
                    id: String(comment.id),
                    sourceType: "review-comment",
                    priority,
                    title: findingTitle(comment.body, priority),
                    body: String(comment.body ?? ""),
                    url: comment.html_url,
                    path: comment.path ?? null,
                    line: comment.line ?? comment.original_line ?? null,
                  };
                })
                .filter(Boolean);

              const topLevel = issueComments.flatMap((comment) =>
                topLevelFindings(comment, headSha),
              );
              const unique = new Map();
              for (const finding of [...inline, ...topLevel]) {
                unique.set(`${finding.sourceType}:${finding.id}`, finding);
              }
              const findings = [...unique.values()];
              core.info(
                `PR #${prNumber}: reviews=${reviews.length}, inline=${inlineComments.length}, top-level=${issueComments.length}, eligible=${findings.length}`,
              );
              return findings;
            }

            async function existingTrackingIssues() {
              const items = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "all", per_page: 100,
              });
              return items.filter((item) => !item.pull_request);
            }

            function issueBody(pr, finding, fp) {
              const blocking = ["P0", "P1"].includes(finding.priority);
              const quote = String(finding.body ?? "")
                .replace(/\r\n/g, "\n")
                .split("\n")
                .map((line) => `> ${line}`)
                .join("\n");
              const location = finding.path
                ? `\`${finding.path}${finding.line ? `:${finding.line}` : ""}\``
                : "レビューコメント内の一般指摘";
              return [
                sourceMarker(pr.number, finding),
                `<!-- codex-review-fingerprint:${fp} -->`,
                "",
                "## Summary",
                `${finding.priority}のCodex Code Review findingを追跡します。`,
                "",
                "## Source PR and review",
                `- PR: ${pr.html_url}`,
                `- Review finding: ${finding.url}`,
                `- Reviewed HEAD: \`${pr.head.sha}\``,
                `- Source type: \`${finding.sourceType}\``,
                "",
                "## Priority and disposition",
                `- Priority: **${finding.priority}**`,
                `- Disposition: ${blocking ? "PR内修正必須。Issue化してもマージブロッカーは解除されません。" : "PR内修正か安全な後続作業かを最新HEADで判断してください。"}`,
                "",
                "## Current location",
                `- ${location}`,
                "",
                "## Original review finding",
                quote,
                "",
                "## Acceptance criteria",
                "- レビュー記載のTriggerが最新ブランチで再現しない",
                "- 根本原因と影響範囲を説明できる",
                "- 回帰テストまたは具体的な検証を実行する",
                "- 元レビューを再確認して対応結果を記録する",
                "",
                "## Merge safety",
                blocking
                  ? "このIssueの存在は、P0/P1を含むPRを安全にマージできる根拠にはなりません。"
                  : "延期する場合は、現行契約上PRが安全であることを別途確認してください。",
              ].join("\n");
            }

            async function synchronize(pr, findings) {
              const issues = await existingTrackingIssues();
              const created = [];
              const reused = [];

              for (const finding of findings) {
                const fp = fingerprint(pr.number, finding);
                const source = sourceMarker(pr.number, finding);
                const fpMarker = `<!-- codex-review-fingerprint:${fp} -->`;
                const existing = issues.find((issue) =>
                  typeof issue.body === "string" &&
                  (issue.body.includes(source) || issue.body.includes(fpMarker)),
                );
                if (existing) {
                  reused.push(existing);
                  continue;
                }

                const latest = await github.rest.pulls.get({
                  owner, repo, pull_number: pr.number,
                });
                if (!isOpenAtHead(latest.data, pr.head.sha)) return;

                const response = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[${finding.priority}][Code Review][PR #${pr.number}] ${finding.title}`.slice(0, 250),
                  body: issueBody(pr, finding, fp),
                });
                created.push(response.data);
                issues.push(response.data);
              }

              const sourceHash = crypto
                .createHash("sha256")
                .update(findings.map((f) => `${f.sourceType}:${f.id}`).sort().join(","))
                .digest("hex")
                .slice(0, 20);
              const marker = `<!-- codex-review-issues-summary:${pr.head.sha}:${sourceHash} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const summarized = comments.some((comment) =>
                isTrustedSummary(comment.user?.login) &&
                typeof comment.body === "string" &&
                comment.body.includes(marker),
              );

              if (!summarized || forced()) {
                const summary = [
                  marker,
                  "## Codexレビュー指摘のIssue同期",
                  "",
                  `検証対象HEAD: \`${pr.head.sha}\``,
                  "",
                  "### Created Issues",
                  ...(created.length
                    ? created.map((issue) => `- [#${issue.number}](${issue.html_url}) ${issue.title}`)
                    : ["- なし"]),
                  "",
                  "### Reused existing Issues",
                  ...(reused.length
                    ? reused.map((issue) => `- [#${issue.number}](${issue.html_url}) ${issue.title}`)
                    : ["- なし"]),
                  "",
                  "P0/P1はIssue化後もPR内修正必須です。P2の延期可否は別途判断してください。",
                ].join("\n");
                try {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number, body: summary,
                  });
                } catch (error) {
                  core.warning(`Issues were created, but summary posting failed: ${error.message}`);
                }
              }
              core.info(`PR #${pr.number}: created=${created.length}, reused=${reused.length}`);
            }

            async function resolvePrNumbers() {
              if (eventName === "pull_request_target") {
                const number = context.payload.pull_request?.number;
                return Number.isInteger(number) ? [number] : [];
              }
              if (eventName === "workflow_dispatch") {
                const raw = String(process.env.DISPATCH_PR_NUMBER ?? "").trim();
                if (raw) {
                  const number = Number(raw);
                  if (!Number.isInteger(number) || number < 1) {
                    core.setFailed("pr_number must be a positive integer");
                    return [];
                  }
                  return [number];
                }
              }
              const open = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100,
              });
              return open.map((pr) => pr.number);
            }

            async function inspect(prNumber, poll) {
              const initial = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              if (!isOpenAtHead(initial.data, initial.data.head.sha)) return;
              const headSha = initial.data.head.sha;
              const attempts = poll ? 30 : 1;

              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                const latest = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                });
                if (!isOpenAtHead(latest.data, headSha)) return;
                const findings = await collectFindings(prNumber, headSha);
                if (findings.length > 0) {
                  await synchronize(latest.data, findings);
                  return;
                }
                if (attempt < attempts) {
                  core.info(`PR #${prNumber}: waiting for Codex findings (${attempt}/${attempts})`);
                  await sleep(20_000);
                }
              }
              core.info(`PR #${prNumber}: no active current-head P0-P2 finding`);
            }

            if (eventName === "pull_request_target" && eventAction === "closed") {
              core.info("PR closed or merged; no synchronization needed");
              return;
            }

            const prNumbers = await resolvePrNumbers();
            const poll =
              eventName === "pull_request_target" ||
              (eventName === "workflow_dispatch" && prNumbers.length === 1);
            for (const prNumber of prNumbers) {
              try {
                await inspect(prNumber, poll);
              } catch (error) {
                core.error(`Failed to process PR #${prNumber}: ${error.message}`);
                if (prNumbers.length === 1) throw error;
              }
            }
