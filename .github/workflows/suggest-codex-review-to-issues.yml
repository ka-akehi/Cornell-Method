name: Create Issues from Codex review findings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect; leave empty to scan all open PRs
        required: false
        type: string
      force:
        description: Repost the PR summary for the current finding set
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: codex-review-to-issues-${{ inputs.pr_number || 'scheduled-scan' }}
  cancel-in-progress: true

jobs:
  create-review-issues:
    name: Create Issues from current-head Codex findings
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Scan Codex reviews and create deduplicated Issues
        uses: actions/github-script@v9
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          FORCE_SUMMARY: ${{ inputs.force || false }}
        with:
          retries: 3
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            const sleep = (milliseconds) =>
              new Promise((resolve) => setTimeout(resolve, milliseconds));

            function normalizeLogin(login) {
              return String(login ?? "").replace(/\[bot\]$/i, "").toLowerCase();
            }

            function isCodexConnector(login) {
              return normalizeLogin(login) === "chatgpt-codex-connector";
            }

            function isTrustedAutomationAuthor(login) {
              const normalized = normalizeLogin(login);
              return normalized === "github-actions" || normalized === owner.toLowerCase();
            }

            function isForced() {
              return String(process.env.FORCE_SUMMARY ?? "false").toLowerCase() === "true";
            }

            function extractPriority(body) {
              const text = String(body ?? "");
              const badge = text.match(/!\[P([0-3])\s+Badge\]/i);
              if (badge) return `P${badge[1]}`;

              const bracket = text.match(
                /(?:^|\n)\s*(?:#{1,6}\s*)?(?:[-*]\s*)?\[P([0-3])\](?:\s+|$)/i,
              );
              return bracket ? `P${bracket[1]}` : null;
            }

            function cleanFindingTitle(body, fallback) {
              const firstLine =
                String(body ?? "")
                  .replace(/\r\n/g, "\n")
                  .split("\n")
                  .map((line) => line.trim())
                  .find(Boolean) ?? fallback;

              const cleaned = firstLine
                .replace(/!\[P[0-3]\s+Badge\]\([^)]*\)/gi, "")
                .replace(/^#{1,6}\s*/, "")
                .replace(/^\[P[0-3]\]\s*/i, "")
                .replace(/<[^>]+>/g, "")
                .replace(/[*_`~]/g, "")
                .replace(/\s+/g, " ")
                .trim();

              return (cleaned || fallback).slice(0, 160);
            }

            function normalizeRootCause(value) {
              return String(value ?? "")
                .toLowerCase()
                .normalize("NFKC")
                .replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 120);
            }

            function sourceMarker(pullRequestNumber, finding) {
              return `<!-- codex-review-source:PR-${pullRequestNumber}:${finding.sourceType}:${finding.sourceId} -->`;
            }

            function fingerprintFor(pullRequestNumber, finding) {
              const input = [
                `PR-${pullRequestNumber}`,
                finding.path ?? "general",
                normalizeRootCause(finding.title),
              ].join(":");

              return crypto.createHash("sha256").update(input).digest("hex").slice(0, 24);
            }

            function fingerprintMarker(fingerprint) {
              return `<!-- codex-review-fingerprint:${fingerprint} -->`;
            }

            function quoteMarkdown(value) {
              return String(value ?? "")
                .replace(/\r\n/g, "\n")
                .split("\n")
                .map((line) => `> ${line}`)
                .join("\n");
            }

            function extractReferencedHead(body) {
              const match = String(body ?? "").match(
                /(?:検証対象HEAD|対象HEAD|Reviewed commit|Reviewed HEAD)\s*[:：]\s*`?([0-9a-f]{7,40})`?/i,
              );
              return match?.[1]?.toLowerCase() ?? null;
            }

            function parseTopLevelFindingBlocks(comment, headSha) {
              const body = String(comment.body ?? "").replace(/\r\n/g, "\n");
              if (!isCodexConnector(comment.user?.login)) return [];
              if (!/(?:^|\n)#{1,3}\s*(?:Findings|指摘|Escalated P0\/P1 findings)\s*$/im.test(body)) {
                return [];
              }

              const referencedHead = extractReferencedHead(body);
              if (!referencedHead || !headSha.toLowerCase().startsWith(referencedHead)) {
                return [];
              }

              const lines = body.split("\n");
              const findings = [];

              for (let index = 0; index < lines.length; index += 1) {
                const heading = lines[index].match(/^(#{1,6})\s*\[P([0-3])\]\s+(.+?)\s*$/i);
                if (!heading) continue;

                const headingLevel = heading[1].length;
                let endIndex = lines.length;
                for (let cursor = index + 1; cursor < lines.length; cursor += 1) {
                  const nextHeading = lines[cursor].match(/^(#{1,6})\s+\S/);
                  if (nextHeading && nextHeading[1].length <= headingLevel) {
                    endIndex = cursor;
                    break;
                  }
                }

                const block = lines.slice(index, endIndex).join("\n").trim();
                const location = block.match(
                  /(?:^|\n)\s*-\s*Location\s*:\s*`?([^:\n`]+?)(?::(\d+))?`?\s*$/im,
                );

                findings.push({
                  sourceType: "issue-comment",
                  sourceId: String(comment.id),
                  priority: `P${heading[2]}`,
                  title: cleanFindingTitle(lines[index], heading[3]),
                  body: block,
                  url: comment.html_url,
                  path: location?.[1]?.trim() ?? null,
                  line: location?.[2] ? Number(location[2]) : null,
                });

                index = endIndex - 1;
              }

              return findings;
            }

            async function resolvePullRequestNumbers() {
              if (eventName === "workflow_dispatch") {
                const value = String(process.env.DISPATCH_PR_NUMBER ?? "").trim();
                if (value) {
                  const number = Number(value);
                  if (!Number.isInteger(number) || number < 1) {
                    core.setFailed("pr_number must be a positive integer.");
                    return [];
                  }
                  return [number];
                }
              }

              const openPullRequests = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: "open",
                  per_page: 100,
                },
              );

              return openPullRequests.map((pullRequest) => pullRequest.number);
            }

            async function listActiveReviewCommentIds(pullRequestNumber) {
              try {
                const result = await github.graphql(
                  `query ReviewThreads($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100) {
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 100) {
                              nodes {
                                databaseId
                              }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  {
                    owner,
                    repo,
                    number: pullRequestNumber,
                  },
                );

                return new Set(
                  (result.repository?.pullRequest?.reviewThreads?.nodes ?? [])
                    .filter((thread) => !thread.isResolved && !thread.isOutdated)
                    .flatMap((thread) =>
                      (thread.comments?.nodes ?? [])
                        .map((comment) => comment.databaseId)
                        .filter(Number.isInteger),
                    ),
                );
              } catch (error) {
                core.warning(
                  `Could not read review-thread state for PR #${pullRequestNumber}; falling back to current-head review comments: ${error?.message ?? error}`,
                );
                return null;
              }
            }

            async function collectCurrentHeadFindings(pullRequestNumber, headSha) {
              const [reviews, reviewComments, issueComments, activeReviewCommentIds] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  owner,
                  repo,
                  pull_number: pullRequestNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  owner,
                  repo,
                  pull_number: pullRequestNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: pullRequestNumber,
                  per_page: 100,
                }),
                listActiveReviewCommentIds(pullRequestNumber),
              ]);

              const currentReviewIds = new Set(
                reviews
                  .filter(
                    (review) =>
                      isCodexConnector(review.user?.login) &&
                      review.commit_id === headSha &&
                      review.state !== "PENDING",
                  )
                  .map((review) => review.id),
              );

              const inlineFindings = reviewComments
                .filter(
                  (comment) =>
                    isCodexConnector(comment.user?.login) &&
                    !comment.in_reply_to_id &&
                    currentReviewIds.has(comment.pull_request_review_id) &&
                    (activeReviewCommentIds === null ||
                      activeReviewCommentIds.has(comment.id)),
                )
                .map((comment) => {
                  const priority = extractPriority(comment.body);
                  if (!priority) return null;

                  return {
                    sourceType: "review-comment",
                    sourceId: String(comment.id),
                    reviewId: String(comment.pull_request_review_id),
                    priority,
                    title: cleanFindingTitle(
                      comment.body,
                      `${priority} review finding`,
                    ),
                    body: String(comment.body ?? ""),
                    url: comment.html_url,
                    path: comment.path ?? null,
                    line: comment.line ?? comment.original_line ?? null,
                  };
                })
                .filter(Boolean);

              const topLevelFindings = issueComments.flatMap((comment) =>
                parseTopLevelFindingBlocks(comment, headSha),
              );

              const bySource = new Map();
              for (const finding of [...inlineFindings, ...topLevelFindings]) {
                bySource.set(`${finding.sourceType}:${finding.sourceId}:${finding.priority}`, finding);
              }

              return {
                findings: [...bySource.values()],
                issueComments,
              };
            }

            async function listExistingTrackingIssues() {
              const items = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner,
                  repo,
                  state: "all",
                  per_page: 100,
                },
              );

              return items.filter((item) => !item.pull_request);
            }

            function buildIssueBody(
              pullRequest,
              finding,
              sourceSetHash,
              fingerprint,
            ) {
              const location = finding.path
                ? `\`${finding.path}${finding.line ? `:${finding.line}` : ""}\``
                : "レビューコメント内の一般指摘";

              const blocking = finding.priority === "P0" || finding.priority === "P1";
              const disposition = blocking
                ? "PR内修正必須。追跡Issueを作成しても、このPRのマージブロッカーは解除されません。"
                : "追跡対象。PR内で修正するか独立した後続作業として扱うかを、最新HEADで判断してください。";

              return [
                sourceMarker(pullRequest.number, finding),
                fingerprintMarker(fingerprint),
                "",
                "## Summary",
                `${finding.priority}のCodex Code Review findingを追跡します。`,
                "",
                "## Source PR and review",
                `- PR: ${pullRequest.html_url}`,
                `- Review finding: ${finding.url}`,
                `- Reviewed HEAD: \`${pullRequest.head.sha}\``,
                "",
                "## Priority and disposition",
                `- Priority: **${finding.priority}**`,
                `- Disposition: ${disposition}`,
                "",
                "## Current location",
                `- ${location}`,
                "",
                "## Original review finding",
                quoteMarkdown(finding.body),
                "",
                "## Acceptance criteria",
                "- 最新の対象ブランチで、レビューに記載されたTriggerが再現しない",
                "- 根本原因を修正または明示的に受け入れ、影響範囲を説明できる",
                "- 具体的な回帰テストまたは検証手順を追加・実行する",
                "- 元のレビュー指摘を再確認し、対応結果を記録する",
                "",
                "## Verification",
                `- Source type: \`${finding.sourceType}\``,
                `- Source id: \`${finding.sourceId}\``,
                `- Workflow observed source set: \`${sourceSetHash}\``,
                "",
                "## Merge safety",
                blocking
                  ? "このIssueの存在や完了予定は、P0/P1を含むPRを安全にマージできる根拠にはなりません。"
                  : "このIssueへの延期は、PRが現行契約上安全であることを別途確認した場合に限ります。",
                "",
                "## Fingerprint",
                `- \`${fingerprint}\``,
              ].join("\n");
            }

            async function processFindings(
              pullRequest,
              allFindings,
              issueComments,
            ) {
              const issueEligible = allFindings.filter((finding) =>
                ["P0", "P1", "P2"].includes(finding.priority),
              );
              const p3Findings = allFindings.filter(
                (finding) => finding.priority === "P3",
              );

              if (issueEligible.length === 0) {
                return false;
              }

              issueEligible.sort(
                (left, right) =>
                  Number(left.priority.slice(1)) - Number(right.priority.slice(1)),
              );

              const sourceSet = issueEligible
                .map((finding) => `${finding.sourceType}:${finding.sourceId}`)
                .sort()
                .join(",");

              const sourceSetHash = crypto
                .createHash("sha256")
                .update(sourceSet)
                .digest("hex")
                .slice(0, 20);
              const summaryMarker =
                `<!-- codex-review-issues-summary:${pullRequest.head.sha}:${sourceSetHash} -->`;

              if (
                !isForced() &&
                issueComments.some(
                  (comment) =>
                    isTrustedAutomationAuthor(comment.user?.login) &&
                    typeof comment.body === "string" &&
                    comment.body.includes(summaryMarker),
                )
              ) {
                core.info(
                  `The current finding set was already processed for PR #${pullRequest.number}.`,
                );
                return true;
              }

              const trackingIssues = await listExistingTrackingIssues();
              const created = [];
              const reused = [];

              for (const finding of issueEligible.slice(0, 5)) {
                const fingerprint = fingerprintFor(pullRequest.number, finding);
                const source = sourceMarker(pullRequest.number, finding);
                const fingerprintToken = fingerprintMarker(fingerprint);

                const existing = trackingIssues.find(
                  (issue) =>
                    typeof issue.body === "string" &&
                    (issue.body.includes(source) ||
                      issue.body.includes(fingerprintToken)),
                );

                if (existing) {
                  reused.push({
                    finding,
                    number: existing.number,
                    url: existing.html_url,
                    title: existing.title,
                  });
                  continue;
                }

                const title =
                  `[${finding.priority}][Code Review][PR #${pullRequest.number}] ` +
                  finding.title;
                const body = buildIssueBody(
                  pullRequest,
                  finding,
                  sourceSetHash,
                  fingerprint,
                );
                const response = await github.rest.issues.create({
                  owner,
                  repo,
                  title: title.slice(0, 250),
                  body,
                });

                const record = {
                  finding,
                  number: response.data.number,
                  url: response.data.html_url,
                  title: response.data.title,
                };
                created.push(record);
                trackingIssues.push(response.data);
              }

              const blocking = issueEligible.filter((finding) =>
                ["P0", "P1"].includes(finding.priority),
              );
              const skippedForLimit = issueEligible.slice(5);

              const summary = [
                summaryMarker,
                "## Codexレビュー指摘のIssue同期",
                "",
                `検証対象HEAD: \`${pullRequest.head.sha}\``,
                "",
                "### Created Issues",
                ...(created.length
                  ? created.map(
                      (item) =>
                        `- [#${item.number}](${item.url}) ${item.title}`,
                    )
                  : ["- なし"]),
                "",
                "### Reused existing Issues",
                ...(reused.length
                  ? reused.map(
                      (item) =>
                        `- [#${item.number}](${item.url}) ${item.title}`,
                    )
                  : ["- なし"]),
                "",
                "### PR内修正必須",
                ...(blocking.length
                  ? blocking.map(
                      (finding) =>
                        `- ${finding.priority}: [${finding.title}](${finding.url})`,
                    )
                  : ["- なし"]),
                "",
                "### Skipped",
                `- P3 / non-blocking improvement: ${p3Findings.length}件`,
                `- 1回の上限5件を超えたP0〜P2: ${skippedForLimit.length}件`,
                "",
                "P0/P1はIssueを作成・再利用してもマージブロッカーのままです。",
                "P2を後続Issueへ延期する場合は、現行契約上PRが安全であることを別途確認してください。",
              ].join("\n");

              const latestPullRequest = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullRequest.number,
              });

              if (
                latestPullRequest.data.state !== "open" ||
                latestPullRequest.data.head.sha !== pullRequest.head.sha
              ) {
                core.info(
                  `PR #${pullRequest.number} was closed or its head changed before summary posting.`,
                );
                return true;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body: summary,
              });

              core.info(
                `Processed ${issueEligible.length} P0-P2 finding(s) for PR #${pullRequest.number}.`,
              );
              return true;
            }

            async function inspectPullRequest(pullRequestNumber, allowPolling) {
              const initial = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullRequestNumber,
              });

              if (initial.data.state !== "open") {
                core.info(`PR #${pullRequestNumber} is not open.`);
                return;
              }

              const headSha = initial.data.head.sha;
              const maximumAttempts = allowPolling ? 30 : 1;

              for (let attempt = 1; attempt <= maximumAttempts; attempt += 1) {
                const latest = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullRequestNumber,
                });

                if (
                  latest.data.state !== "open" ||
                  latest.data.head.sha !== headSha
                ) {
                  core.info(
                    `PR #${pullRequestNumber} was closed or its head changed while waiting.`,
                  );
                  return;
                }

                const collection = await collectCurrentHeadFindings(
                  pullRequestNumber,
                  headSha,
                );

                if (
                  collection.findings.some((finding) =>
                    ["P0", "P1", "P2"].includes(finding.priority),
                  )
                ) {
                  await processFindings(
                    latest.data,
                    collection.findings,
                    collection.issueComments,
                  );
                  return;
                }

                if (attempt < maximumAttempts) {
                  core.info(
                    `No current-head P0-P2 Codex finding for PR #${pullRequestNumber}; waiting (${attempt}/${maximumAttempts}).`,
                  );
                  await sleep(20_000);
                }
              }

              core.info(
                `No current-head P0-P2 Codex finding was found for PR #${pullRequestNumber}.`,
              );
            }

            const pullRequestNumbers = await resolvePullRequestNumbers();
            const allowPolling =
              eventName === "workflow_dispatch" && pullRequestNumbers.length === 1;

            for (const pullRequestNumber of pullRequestNumbers) {
              try {
                await inspectPullRequest(pullRequestNumber, allowPolling);
              } catch (error) {
                core.error(
                  `Failed to process PR #${pullRequestNumber}: ${error?.message ?? error}`,
                );
                if (pullRequestNumbers.length === 1) {
                  throw error;
                }
              }
            }
