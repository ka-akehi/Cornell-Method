name: Create Issues from Codex review findings

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - closed
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect; leave empty to scan all open PRs
        required: false
        type: string
      force:
        description: Repost the PR summary for the current finding set
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-to-issues-${{ github.event.pull_request.number || inputs.pr_number || 'scheduled-scan' }}
  cancel-in-progress: true

jobs:
  create-review-issues:
    name: Create Issues from current-head Codex findings
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Scan Codex findings and create deduplicated Issues
        uses: actions/github-script@v9
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          FORCE_SUMMARY: ${{ inputs.force || false }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const crypto = require("crypto");
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            const eventAction = context.payload.action;
            const sleep = (milliseconds) =>
              new Promise((resolve) => setTimeout(resolve, milliseconds));

            function normalizeLogin(login) {
              return String(login ?? "").replace(/\[bot\]$/i, "").toLowerCase();
            }

            function isCodexConnector(login) {
              return normalizeLogin(login) === "chatgpt-codex-connector";
            }

            function isForced() {
              return String(process.env.FORCE_SUMMARY ?? "false").toLowerCase() === "true";
            }

            function isOpenAtHead(pullRequest, headSha) {
              return (
                pullRequest.state === "open" &&
                pullRequest.merged_at == null &&
                pullRequest.head?.sha === headSha
              );
            }

            function extractPriority(body) {
              const text = String(body ?? "");
              const badge = text.match(/!\[P([0-3])\s+Badge\](?:\([^)]*\))?/i);
              if (badge) return `P${badge[1]}`;

              const bracket = text.match(
                /(?:^|\n)\s*(?:#{1,6}\s*)?(?:[-*]\s*)?\[P([0-3])\](?:\s+|$)/i,
              );
              return bracket ? `P${bracket[1]}` : null;
            }

            function cleanFindingTitle(body, priority) {
              const firstLine =
                String(body ?? "")
                  .replace(/\r\n/g, "\n")
                  .split("\n")
                  .map((line) => line.trim())
                  .find(Boolean) ?? `${priority} review finding`;

              const title = firstLine
                .replace(/!\[P[0-3]\s+Badge\](?:\([^)]*\))?/gi, "")
                .replace(/<[^>]+>/g, "")
                .replace(/^#{1,6}\s*/, "")
                .replace(/^\[P[0-3]\]\s*/i, "")
                .replace(/[*_`~]/g, "")
                .replace(/\s+/g, " ")
                .trim();

              return (title || `${priority} review finding`).slice(0, 160);
            }

            function normalizeRootCause(value) {
              return String(value ?? "")
                .toLowerCase()
                .normalize("NFKC")
                .replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 120);
            }

            function sourceMarker(prNumber, finding) {
              return `<!-- codex-review-source:PR-${prNumber}:review-comment:${finding.id} -->`;
            }

            function fingerprint(prNumber, finding) {
              const input = [
                `PR-${prNumber}`,
                finding.path ?? "general",
                normalizeRootCause(finding.title),
              ].join(":");
              return crypto.createHash("sha256").update(input).digest("hex").slice(0, 24);
            }

            function fingerprintMarker(value) {
              return `<!-- codex-review-fingerprint:${value} -->`;
            }

            function quoteMarkdown(value) {
              return String(value ?? "")
                .replace(/\r\n/g, "\n")
                .split("\n")
                .map((line) => `> ${line}`)
                .join("\n");
            }

            if (eventName === "pull_request_target" && eventAction === "closed") {
              core.info("The PR was closed or merged. Cancelling any in-progress scan.");
              return;
            }

            async function resolvePullRequestNumbers() {
              if (eventName === "pull_request_target") {
                const number = context.payload.pull_request?.number;
                return Number.isInteger(number) ? [number] : [];
              }

              if (eventName === "workflow_dispatch") {
                const value = String(process.env.DISPATCH_PR_NUMBER ?? "").trim();
                if (value) {
                  const number = Number(value);
                  if (!Number.isInteger(number) || number < 1) {
                    core.setFailed("pr_number must be a positive integer.");
                    return [];
                  }
                  return [number];
                }
              }

              const openPullRequests = await github.paginate(
                github.rest.pulls.list,
                { owner, repo, state: "open", per_page: 100 },
              );
              return openPullRequests.map((pullRequest) => pullRequest.number);
            }

            async function readActiveReviewCommentIds(prNumber) {
              try {
                const result = await github.graphql(
                  `query ReviewThreads($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100) {
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 100) {
                              nodes { databaseId }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: prNumber },
                );

                const threads = result.repository?.pullRequest?.reviewThreads?.nodes;
                if (!Array.isArray(threads)) return null;

                return new Set(
                  threads
                    .filter((thread) => !thread.isResolved && !thread.isOutdated)
                    .flatMap((thread) => thread.comments?.nodes ?? [])
                    .map((comment) => comment.databaseId)
                    .filter(Number.isInteger),
                );
              } catch (error) {
                core.warning(
                  `Could not read review-thread state for PR #${prNumber}; using current-head REST comments: ${error?.message ?? error}`,
                );
                return null;
              }
            }

            async function collectFindings(prNumber, headSha) {
              const [reviews, comments, activeIds] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                }),
                readActiveReviewCommentIds(prNumber),
              ]);

              const currentReviewIds = new Set(
                reviews
                  .filter(
                    (review) =>
                      isCodexConnector(review.user?.login) &&
                      review.commit_id === headSha &&
                      review.state !== "PENDING",
                  )
                  .map((review) => review.id),
              );

              const candidates = comments.filter((comment) => {
                if (!isCodexConnector(comment.user?.login)) return false;
                if (comment.in_reply_to_id) return false;

                const belongsToCurrentHead =
                  comment.commit_id === headSha ||
                  currentReviewIds.has(comment.pull_request_review_id);
                if (!belongsToCurrentHead) return false;

                if (activeIds !== null && !activeIds.has(comment.id)) return false;
                return true;
              });

              const findings = candidates
                .map((comment) => {
                  const priority = extractPriority(comment.body);
                  if (!priority || priority === "P3") return null;
                  return {
                    id: comment.id,
                    priority,
                    title: cleanFindingTitle(comment.body, priority),
                    body: String(comment.body ?? ""),
                    url: comment.html_url,
                    path: comment.path ?? null,
                    line: comment.line ?? comment.original_line ?? null,
                  };
                })
                .filter(Boolean);

              core.info(
                `PR #${prNumber}: ${reviews.length} review(s), ${comments.length} inline comment(s), ${findings.length} active current-head P0-P2 finding(s).`,
              );
              return findings;
            }

            async function listTrackingIssues() {
              const items = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "all",
                per_page: 100,
              });
              return items.filter((item) => !item.pull_request);
            }

            function buildIssueBody(pullRequest, finding, fp) {
              const blocking = finding.priority === "P0" || finding.priority === "P1";
              const location = finding.path
                ? `\`${finding.path}${finding.line ? `:${finding.line}` : ""}\``
                : "レビューコメント内の一般指摘";

              return [
                sourceMarker(pullRequest.number, finding),
                fingerprintMarker(fp),
                "",
                "## Summary",
                `${finding.priority}のCodex Code Review findingを追跡します。`,
                "",
                "## Source PR and review",
                `- PR: ${pullRequest.html_url}`,
                `- Review finding: ${finding.url}`,
                `- Reviewed HEAD: \`${pullRequest.head.sha}\``,
                "",
                "## Priority and disposition",
                `- Priority: **${finding.priority}**`,
                `- Disposition: ${blocking ? "PR内修正必須。Issueを作成してもマージブロッカーは解除されません。" : "追跡対象。PR内修正か安全な後続作業かを最新HEADで判断してください。"}`,
                "",
                "## Current location",
                `- ${location}`,
                "",
                "## Original review finding",
                quoteMarkdown(finding.body),
                "",
                "## Acceptance criteria",
                "- 最新の対象ブランチでレビュー記載のTriggerが再現しない",
                "- 根本原因を修正または明示的に受け入れ、影響範囲を説明できる",
                "- 回帰テストまたは具体的な検証手順を追加・実行する",
                "- 元のレビュー指摘を再確認し、対応結果を記録する",
                "",
                "## Merge safety",
                blocking
                  ? "このIssueの存在は、P0/P1を含むPRを安全にマージできる根拠にはなりません。"
                  : "このIssueへの延期は、PRが現行契約上安全であることを別途確認した場合に限ります。",
                "",
                "## Fingerprint",
                `- \`${fp}\``,
              ].join("\n");
            }

            async function createOrReuseIssues(pullRequest, findings) {
              const existingIssues = await listTrackingIssues();
              const created = [];
              const reused = [];

              for (const finding of findings) {
                const fp = fingerprint(pullRequest.number, finding);
                const source = sourceMarker(pullRequest.number, finding);
                const fpMarker = fingerprintMarker(fp);
                const existing = existingIssues.find(
                  (issue) =>
                    typeof issue.body === "string" &&
                    (issue.body.includes(source) || issue.body.includes(fpMarker)),
                );

                if (existing) {
                  reused.push(existing);
                  continue;
                }

                const latest = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullRequest.number,
                });
                if (!isOpenAtHead(latest.data, pullRequest.head.sha)) {
                  core.info(`PR #${pullRequest.number} changed before Issue creation.`);
                  return;
                }

                const response = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[${finding.priority}][Code Review][PR #${pullRequest.number}] ${finding.title}`.slice(0, 250),
                  body: buildIssueBody(pullRequest, finding, fp),
                });
                created.push(response.data);
                existingIssues.push(response.data);
              }

              const sourceHash = crypto
                .createHash("sha256")
                .update(findings.map((finding) => finding.id).sort().join(","))
                .digest("hex")
                .slice(0, 20);
              const marker = `<!-- codex-review-issues-summary:${pullRequest.head.sha}:${sourceHash} -->`;

              const priorComments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });
              const alreadySummarized = priorComments.some(
                (comment) =>
                  typeof comment.body === "string" && comment.body.includes(marker),
              );

              if (!alreadySummarized || isForced()) {
                const summary = [
                  marker,
                  "## Codexレビュー指摘のIssue同期",
                  "",
                  `検証対象HEAD: \`${pullRequest.head.sha}\``,
                  "",
                  "### Created Issues",
                  ...(created.length
                    ? created.map((issue) => `- [#${issue.number}](${issue.html_url}) ${issue.title}`)
                    : ["- なし"]),
                  "",
                  "### Reused existing Issues",
                  ...(reused.length
                    ? reused.map((issue) => `- [#${issue.number}](${issue.html_url}) ${issue.title}`)
                    : ["- なし"]),
                  "",
                  "P0/P1はIssue化後もPR内修正必須です。P2の延期可否は別途判断してください。",
                ].join("\n");

                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: pullRequest.number,
                    body: summary,
                  });
                } catch (error) {
                  core.warning(
                    `Issues were synchronized, but the PR summary comment failed: ${error?.message ?? error}`,
                  );
                }
              }

              core.info(
                `PR #${pullRequest.number}: created ${created.length}, reused ${reused.length}.`,
              );
            }

            async function inspectPullRequest(prNumber, allowPolling) {
              const initial = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              if (initial.data.state !== "open" || initial.data.merged_at != null) return;

              const headSha = initial.data.head.sha;
              const attempts = allowPolling ? 30 : 1;

              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                const latest = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                if (!isOpenAtHead(latest.data, headSha)) return;

                const findings = await collectFindings(prNumber, headSha);
                if (findings.length > 0) {
                  await createOrReuseIssues(latest.data, findings);
                  return;
                }

                if (attempt < attempts) await sleep(20_000);
              }

              core.info(`PR #${prNumber}: no active current-head P0-P2 finding.`);
            }

            const pullRequestNumbers = await resolvePullRequestNumbers();
            const allowPolling =
              eventName === "pull_request_target" ||
              (eventName === "workflow_dispatch" && pullRequestNumbers.length === 1);

            for (const prNumber of pullRequestNumbers) {
              try {
                await inspectPullRequest(prNumber, allowPolling);
              } catch (error) {
                core.error(`Failed to process PR #${prNumber}: ${error?.message ?? error}`);
                if (pullRequestNumbers.length === 1) throw error;
              }
            }
