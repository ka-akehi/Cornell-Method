name: Trigger Codex review findings to Issues

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: codex-review-to-issues-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  trigger-review-to-issues:
    name: Trigger Codex review findings to Issues
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type == 'Bot' &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post the Codex Issue-conversion command
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const pullRequestNumber = context.payload.issue.number;
            const sourceComment = context.payload.comment;
            const sourceCommentId = String(sourceComment.id);
            const sourceReviewUrl =
              sourceComment.html_url ?? context.payload.issue.html_url;
            const reviewBody = (sourceComment.body ?? "").replace(/\r\n/g, "\n");
            const reviewLines = reviewBody.split("\n");

            // Only react to completed Code Review summaries. The same Codex bot also
            // posts task results, so filtering solely by author would create a loop.
            const findingsHeadingIndex = reviewLines.findIndex((line) =>
              /^#{1,3}\s*(Findings|指摘)\s*$/i.test(line.trim()),
            );
            const hasCompletionHeading = reviewLines.some((line) =>
              /^#{1,3}\s*(Verdict|判定|Reviewed Scope|レビュー対象|Verification|検証)\s*$/i.test(
                line.trim(),
              ),
            );
            const isFollowUpCommand = reviewBody.includes(
              "<!-- codex-review-to-issues-trigger:",
            );

            if (
              findingsHeadingIndex < 0 ||
              !hasCompletionHeading ||
              isFollowUpCommand
            ) {
              core.info("The comment is not a completed Codex Code Review summary.");
              return;
            }

            // Inspect only the Findings section. The rest of a documentation review
            // may legitimately contain phrases such as "no findings" in examples.
            const findingsHeading = reviewLines[findingsHeadingIndex].trim();
            const findingsHeadingLevel =
              findingsHeading.match(/^(#{1,3})/)?.[1].length ?? 2;
            let findingsEndIndex = reviewLines.length;

            for (let index = findingsHeadingIndex + 1; index < reviewLines.length; index += 1) {
              const nextHeading = reviewLines[index].trim().match(/^(#{1,6})\s+\S/);
              if (nextHeading && nextHeading[1].length <= findingsHeadingLevel) {
                findingsEndIndex = index;
                break;
              }
            }

            const findingsSection = reviewLines
              .slice(findingsHeadingIndex + 1, findingsEndIndex)
              .join("\n")
              .trim();
            const hasExplicitPriorityFinding =
              /(^|\n)\s*(?:#{1,6}\s*)?(?:[-*]\s*)?\[P[0-3]\]\s+/im.test(
                findingsSection,
              );

            // Do not spend another Codex task on a review that explicitly reports
            // no findings. An explicit P0-P3 heading takes precedence over a generic
            // no-material-issues sentence in the same section.
            const noFindingPatterns = [
              /重大な問題は確認できませんでした/,
              /重大な問題は見つかりませんでした/,
              /重大な指摘は(?:確認できませんでした|ありません)/,
              /指摘(?:事項)?はありません/,
              /^(?:なし|該当なし)[。.]?$/m,
              /\bno\s+(?:material|actionable|blocking|significant)\s+(?:issues?|findings?)\s+(?:were\s+)?(?:found|identified)\b/i,
              /\bno\s+findings?\b/i,
              /\bfindings?\s*:\s*none\b/i,
            ];

            if (
              !hasExplicitPriorityFinding &&
              noFindingPatterns.some((pattern) => pattern.test(findingsSection))
            ) {
              core.info("The Codex review explicitly reports no findings.");
              return;
            }

            // A stable marker prevents duplicate commands if the workflow run is
            // retried for the same source review comment.
            const marker =
              `<!-- codex-review-to-issues-trigger:${sourceCommentId} -->`;
            const existingComments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pullRequestNumber,
                per_page: 100,
              },
            );

            if (
              existingComments.some(
                (comment) =>
                  typeof comment.body === "string" &&
                  comment.body.includes(marker),
              )
            ) {
              core.info("The Codex follow-up command was already posted.");
              return;
            }

            const command = [
              "@codex",
              marker,
              "",
              "$cornell-review-to-issues を使用してください。",
              "",
              "このPRの最新HEADと、次の chatgpt-codex-connector によるコードレビューを再確認してください。",
              `- Source review: ${sourceReviewUrl}`,
              `- Source review comment ID: ${sourceCommentId}`,
              "",
              "最新HEADでも未解決で、独立した対応として安全に延期できる項目だけを、重複確認のうえGitHub Issuesへ登録してください。",
              "",
              "必須ルール:",
              "- P0/P1はIssueへ先送りせず、`PR fix required` としてPRに残す。",
              "- P2は現在のPRが安全で、独立して完了・検証できる場合だけIssue化する。",
              "- 修正済み、outdated、重複、誤検知、根拠不足、P3/NitはIssue化しない。",
              "- 1コメントではなく、1つの根本原因につき1 Issueにまとめる。",
              "- open/closed Issueをfingerprintで検索し、重複作成しない。",
              "- Issue作成後は、作成・再利用・PR内修正・スキップをこのPRへ1件の集約コメントで報告する。",
              "- Issue作成権限がない場合は、完全なIssueドラフトとブロッカーを報告する。",
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullRequestNumber,
              body: command,
            });

            core.info(
              `Posted the Codex review-to-Issues command to PR #${pullRequestNumber}.`,
            );
